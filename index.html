<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>映画伞里互动设计 · 猫隐 CATIN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&amp;family=Ma+Shan+Zheng&amp;display=swap" rel="stylesheet"><style>
  :root{
    --xuan:#f2ecdf;            /* 宣纸 */
    --mo:#1c1c22;              /* 玄墨 */
    --dai:#1c4b7d;             /* 黛青 */
    --zhu:#c23b2e;             /* 朱砂 */
    --zhuq:#3a7d5d;            /* 竹青 */
    --teng:#c9941a;            /* 藤黄 */
    --line:rgba(28,28,34,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--xuan)}
  body{font-family:"Noto Serif SC","Songti SC","STSong",serif;color:var(--mo)}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}

  /* ── 竖排标题 ── */
  .title{
    position:fixed;top:28px;left:26px;z-index:5;pointer-events:none;
    writing-mode:vertical-rl;display:flex;gap:14px;align-items:flex-start;
  }
  .title h1{
    font-family:"Ma Shan Zheng","Noto Serif SC",serif;
    font-size:clamp(28px,3.6vw,44px);font-weight:400;letter-spacing:.34em;
    color:var(--mo);
  }
  .title .sub{
    font-size:11px;letter-spacing:.32em;color:rgba(28,28,34,.55);
    padding-top:6px;
  }
  .title::after{
    content:"";display:block;width:1px;align-self:stretch;
    background:linear-gradient(to bottom,var(--line),transparent);
    margin-right:2px;
  }

  /* ── 印章 ── */
  .seal{
    position:fixed;left:30px;top:calc(28px + clamp(190px,30vh,300px));z-index:5;
    pointer-events:none;
    width:34px;height:34px;border-radius:5px;
    background:linear-gradient(135deg,#c0392b,#9d2b20);
    color:#f6efe2;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;font-family:"Ma Shan Zheng",serif;
    font-size:14px;letter-spacing:.1em;line-height:1;
    transform:rotate(-3deg);
    box-shadow:0 1px 4px rgba(157,43,32,.35);
    opacity:.92;
  }

  /* ── 右侧题诗 ── */
  .poem{
    position:fixed;top:34px;right:30px;z-index:5;pointer-events:none;
    writing-mode:vertical-rl;display:flex;gap:16px;
    font-size:14px;letter-spacing:.52em;color:rgba(28,28,34,.34);
  }
  .poem .poem-en{
    font-size:9.5px;letter-spacing:.18em;color:rgba(28,28,34,.42);
    font-family:"Noto Serif SC",serif;
  }

  /* ── 提示 ── */
  .hint{
    position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);
    z-index:5;pointer-events:none;text-align:center;
    font-size:13px;letter-spacing:.46em;text-indent:.46em;
    color:rgba(28,28,34,.5);
    transition:opacity 1.6s ease;
  }
  .hint.gone{opacity:0}

  /* ── 底部操作栏 ── */
  .dock{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:6;display:flex;align-items:center;gap:22px;
    padding:12px 22px;
    background:rgba(242,236,223,.62);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:999px;
  }
  .inks{display:flex;align-items:center;gap:14px}
  .ink{
    appearance:none;border:none;cursor:pointer;position:relative;
    width:24px;height:24px;border-radius:50%;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 1px 3px rgba(28,28,34,.25);
    transition:transform .25s cubic-bezier(.2,.9,.3,1.4);
  }
  .ink:hover{transform:scale(1.18)}
  .ink::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1px solid transparent;transition:border-color .25s ease;
  }
  .ink[aria-pressed="true"]::after{border-color:rgba(28,28,34,.55)}
  .ink .lbl{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.2em;color:rgba(28,28,34,.6);
    opacity:0;transition:opacity .2s;white-space:nowrap;font-family:inherit;
  }
  .ink:hover .lbl,.ink[aria-pressed="true"] .lbl{opacity:1}
  .ink-lun{background:conic-gradient(var(--mo),var(--dai),var(--zhuq),var(--teng),var(--zhu),var(--mo))}
  .ink-mo{background:radial-gradient(circle at 35% 30%, #3c3c46, var(--mo))}
  .ink-dai{background:radial-gradient(circle at 35% 30%, #2f6cab, var(--dai))}
  .ink-zhu{background:radial-gradient(circle at 35% 30%, #de5c4b, var(--zhu))}
  .ink-zhuq{background:radial-gradient(circle at 35% 30%, #56a07c, var(--zhuq))}
  .ink-teng{background:radial-gradient(circle at 35% 30%, #e8b94a, var(--teng))}

  .sep{width:1px;height:22px;background:var(--line)}

  .act{
    appearance:none;background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:12px;letter-spacing:.18em;
    color:rgba(28,28,34,.78);padding:4px 2px;position:relative;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .act::after{
    content:"";position:absolute;left:10%;right:10%;bottom:-2px;height:1px;
    background:var(--mo);transform:scaleX(0);transform-origin:center;
    transition:transform .3s ease;
  }
  .act:hover::after{transform:scaleX(1)}
  .act[aria-pressed="false"]{color:rgba(28,28,34,.38)}
  .act .dot{
    width:7px;height:7px;border-radius:50%;flex:none;
    background:var(--zhu);box-shadow:0 0 6px rgba(194,59,46,.5);
    transition:background .3s,box-shadow .3s;
  }
  .act[aria-pressed="false"] .dot{
    background:transparent;box-shadow:none;
    border:1px solid rgba(28,28,34,.35);
  }

  /* ── 漆扇 ── */
  .fanOverlay{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px;
    background:rgba(242,236,223,.78);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;transition:opacity .6s ease;
  }
  .fanOverlay.show{opacity:1}
  .fanOverlay[hidden]{display:none}
  .fanWrap{
    display:flex;flex-direction:column;align-items:center;gap:22px;
    transform:translateY(46px);transition:transform 1.1s cubic-bezier(.2,.8,.25,1);
  }
  .fanOverlay.show .fanWrap{transform:translateY(0)}
  #fanCanvas{
    width:min(78vw,760px);height:auto;
    filter:drop-shadow(0 18px 30px rgba(28,28,34,.28));
  }
  .fanCaption{
    font-size:14px;letter-spacing:.6em;text-indent:.6em;
    color:rgba(28,28,34,.62);
  }
  .fanActs{display:flex;align-items:center;gap:26px}

  @media (max-width:640px){
    .title{top:20px;left:16px}
    .seal{left:20px;top:calc(20px + 170px);width:28px;height:28px;font-size:12px}
    .poem{display:none}
    .dock{gap:12px;padding:10px 14px}
    .act{font-size:11px;letter-spacing:.12em}
    .inks{gap:11px}
  }

/* ══════════ 猫隐 CATIN · 伞面 v4（含墨猫） ══════════ */
html, body { background:#f2ecdf !important; overflow:hidden !important; }
.title, .sub, .poem, .poem-en, .hint { display:none !important; }
.seal { display:none !important; }
#fanOverlay, .fanWrap, .fanActs, .fanCaption { display:none !important; }

#c {
  position:fixed !important; left:50% !important; top:var(--cy) !important;
  transform:translate(-50%,-50%) !important;
  width:86vmin !important; height:86vmin !important;
  border-radius:50% !important; clip-path:circle(50%) !important;
  z-index:1 !important;
}
#catinVeil {
  position:fixed; left:50%; top:var(--cy); transform:translate(-50%,-50%);
  width:86vmin; height:86vmin; border-radius:50%;
  pointer-events:none; z-index:20;
  background:radial-gradient(circle at 50% 50%,
    rgba(242,236,223,0) 62%, rgba(242,236,223,.16) 80%,
    rgba(242,236,223,.62) 94%, #f2ecdf 100%);
}
#catinRim {
  position:fixed; left:50%; top:var(--cy); transform:translate(-50%,-50%);
  width:86vmin; height:86vmin; border-radius:50%;
  pointer-events:none; z-index:23;
  box-shadow: inset 0 0 0 2px rgba(120,96,72,.42), inset 0 0 22px rgba(90,70,50,.10),
              0 0 0 1px rgba(120,96,72,.18), 0 10px 34px rgba(70,50,30,.14);
}
#catinRibs {
  position:fixed; left:50%; top:var(--cy); transform:translate(-50%,-50%);
  width:86vmin; height:86vmin; pointer-events:none; z-index:21;
}
#catinHub {
  position:fixed; left:50%; top:var(--cy); transform:translate(-50%,-50%);
  width:3.1vmin; height:3.1vmin; border-radius:50%; pointer-events:none; z-index:22;
  background:radial-gradient(circle at 38% 32%, #93795f 0%, #5b4636 55%, #3a2b20 100%);
  box-shadow:0 2px 8px rgba(40,30,20,.5), inset 0 0 5px rgba(255,255,255,.25);
}

/* ── 柔光：让猫所在处纸面留白，墨再浓猫也不消失 ── */
#catinClip {
  position:fixed; left:50%; top:var(--cy); transform:translate(-50%,-50%);
  width:86vmin; height:86vmin; border-radius:50%; overflow:hidden;
  z-index:6; pointer-events:none;
}
#catinCatGlow {
  position:absolute; left:calc(50% - 2.7vmin); top:calc(50% + 11vmin);
  width:58vmin; height:64vmin;
  /* 只跟随位置，不跟随缩放：柔光放大后高不透明度区会压住墨形成白斑 */
  transform:translate(-50%,-50%) translate(var(--ex,0px), var(--ey,0px));
  z-index:7; pointer-events:none;
  /* closest-side：渐变半径落在元素边缘，边缘 alpha=0，不会露出矩形边框 */
  background:radial-gradient(ellipse closest-side at 50% 48%,
    rgba(242,236,223,.92) 0%,
    rgba(242,236,223,.70) 38%,
    rgba(242,236,223,.30) 66%,
    rgba(242,236,223,.06) 88%,
    rgba(242,236,223,0) 100%);
  filter:blur(6px);
}

/* ── 墨猫层：显影 + 边缘渗化 + 呼吸 ── */
#catinCat {
  position:absolute; left:calc(50% - 2.7vmin); top:calc(50% + 11vmin);
  width:36vmin; height:46vmin; z-index:8; pointer-events:none;
  transform:translate(-50%,-50%)
            translate(var(--ex,0px), var(--ey,0px))
            scale(var(--es,1)) rotate(var(--er,0deg));
  transform-origin:50% 50%;
  opacity:0;
  animation:catAppear 2.1s ease-out .2s forwards;
  touch-action:none;
  /* 图片已做 alpha 抠底（含透明区 RGB 清理），不加 filter：
     filter 会创建离屏缓冲，预乘 alpha 时容易把透明区的颜色泄漏成雾 */
}
#catinCat img {
  width:100%; height:100%; display:block;
  animation:catBreathe 9.5s ease-in-out infinite;
  transform-origin:50% 50%;
  pointer-events:none;
}
/* 选中：沿墨迹轮廓的红晕（drop-shadow 跟随 alpha 轮廓，不是矩形框） */
#catinCat.sel {
  filter:drop-shadow(0 0 1.2px rgba(179,53,43,.85))
         drop-shadow(0 0 3px rgba(179,53,43,.35));
}
@keyframes catBreathe {
  0%,100% { transform:scale(1); }
  50%     { transform:scale(1.022); }
}

/* ── 元素栏：纯流体 / 猫 / 桥 / 山 ── */
#catinElBar {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(max(2.5vmin,12px) + 13.5vmin);
  z-index:31; display:flex; align-items:center; gap:1.6vmin;
  padding:.9vmin 1.4vmin; border-radius:999px;
  background:none; box-shadow:none;
  pointer-events:auto;
}
#catinElBar .eb {
  position:relative; display:flex; flex-direction:column; align-items:center;
  gap:.35vmin; border:none; background:none; cursor:pointer; padding:0;
  border-radius:50%;
}
/* 选中态：细圆环（不填充，避免出现底色块） */
#catinElBar .eb::after {
  content:''; position:absolute; inset:-.45vmin; border-radius:50%;
  border:.22vmin solid transparent; pointer-events:none;
  transition:border-color .22s ease, transform .22s ease;
  transform:scale(.92);
}
#catinElBar .eb.on::after { border-color:transparent; transform:scale(1); }
#catinElBar .eb .thumb {
  width:8.2vmin; height:8.2vmin; border-radius:50%; overflow:hidden;
  background:#fffdf8; border:1px solid rgba(120,96,72,.20);
  display:flex; align-items:center; justify-content:center;
  font-family:"Songti SC","SimSun",serif; font-size:1.35vmin; color:#8b7a66;
  transition:background .22s ease, border-color .22s ease;
}
/* 选中：整个圆变墨色，图片反白，状态一眼可辨 */
#catinElBar .eb.on .thumb {
  background:#2b2119; border-color:#2b2119;
}
#catinElBar .eb.on .thumb img {
  opacity:1; transform:scale(1);
  filter:invert(1) brightness(1.85) contrast(.86);
}
#catinElBar .eb .thumb img {
  width:100%; height:100%; object-fit:contain;
  opacity:.78; transform:scale(.94);
  transition:opacity .22s ease, transform .22s ease;
}
#catinElBar .eb.on .thumb img { opacity:1; transform:scale(1); }
/* 纯流体：一个空心圈，不带底块 */
#catinElBar .eb[data-el="none"] .thumb::after {
  content:''; width:42%; height:42%; border-radius:50%;
  border:1.5px solid rgba(107,90,72,.55);
  opacity:.5; transition:opacity .22s, border-color .22s;
}
#catinElBar .eb[data-el="none"].on .thumb::after { opacity:1; border-color:#2b2119; }



@media (max-width: 780px), (pointer: coarse) {
  #catinElBar { gap:10px; padding:8px 12px; bottom:calc(max(2.5vmin,10px) + 168px); }
  #catinElBar .eb .thumb { width:48px; height:48px; font-size:13px; }
  #catinElBar .eb::after { inset:-3px; border-width:2px; }
}
@keyframes catAppear {
  0%   { opacity:0;   filter:blur(9px); }
  55%  { opacity:.92; filter:blur(1.6px); }
  100% { opacity:1; }
}

.dock .lbl { display:none !important; }
.dock .ink, .dock .inks button { width:32px !important; height:32px !important; min-width:32px !important; }
.dock .act { font-size:13px !important; padding:7px 14px !important; }
.dock {
  position:fixed !important; left:50% !important; bottom:2vmin !important;
  transform:translateX(-50%) !important; z-index:30 !important;
  gap:14px !important;
  background:rgba(255,252,245,.95) !important;
  border:1px solid rgba(120,95,70,.18) !important;
  box-shadow:0 8px 26px rgba(70,50,30,.13) !important;
  padding:.85vmin 1.35vmin !important; border-radius:999px !important;
}
/* 品牌：伞外右上，全竖排（古风题款） */
#catinBrand {
  position:fixed;
  bottom:calc(50% + 44vmin);
  right:calc(50% - 43vmin);
  z-index:25;
  display:flex; flex-direction:row; align-items:flex-end; gap:.9vmin;
  pointer-events:none;
}
#catinBrand > div { writing-mode:vertical-rl; text-orientation:upright; }
#catinBrand .cn {
  font-family:"Ma Shan Zheng","STXingkai","STKaiti",serif;
  font-size:5.2vmin; color:#2b2119; letter-spacing:.12em; line-height:1.1;
}
#catinBrand .prod {
  font-family:"Songti SC","SimSun","STSong",serif;
  font-size:1.6vmin; letter-spacing:.16em; color:#4a3f35; line-height:1.5;
}
#catinBrand .en {
  font-family:Georgia,"Times New Roman",serif; font-size:.95vmin;
  letter-spacing:.3em; color:#6b5a48; line-height:1.4;
}
#catinSeal {
  width:4.6vmin; height:4.6vmin; background:#b3352b; color:#fff6ea;
  display:flex; align-items:center; justify-content:center;
  font-family:"Ma Shan Zheng","STXingkai",serif; font-size:1.75vmin;
  letter-spacing:0; line-height:1; padding:.25vmin;
  border-radius:.22vmin; transform:rotate(-2deg);
  box-shadow:inset 0 0 0 .16vmin rgba(255,240,225,.42), 0 2px 6px rgba(120,40,30,.22);
  writing-mode:vertical-rl; text-align:center; flex:0 0 auto;
}
#catinSpec {
  position:fixed; left:2.6vmin; top:2.4vmin; z-index:25; pointer-events:none;
  font-family:Georgia,"Times New Roman",serif; font-size:1.05vmin;
  letter-spacing:.3em; color:rgba(90,72,55,.5); line-height:2.1;
}
#catinSpec b { font-weight:400; color:rgba(90,72,55,.78); letter-spacing:.34em; }
#catinToast {
  position:fixed; left:50%; top:6vmin; transform:translateX(-50%);
  z-index:40; pointer-events:none; opacity:0; transition:opacity .3s;
  background:rgba(43,33,25,.88); color:#f7f1e6; padding:.9vmin 1.8vmin;
  border-radius:999px; font-family:Georgia,serif; font-size:1.2vmin; letter-spacing:.16em;
}

/* ── 移动端适配 ── */
html, body { height: 100%; overscroll-behavior: none; }
#c { touch-action: none !important; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
#catinCat, #catinVeil, #catinRibs, #catinRim, #catinHub, #catinBrand, #catinSpec, #catinCatGlow { -webkit-user-select: none; user-select: none; }


/* ══ 渐变模式 ══ */
#catinMode {
  position:fixed; top:max(2vmin,10px); left:50%; transform:translateX(-50%);
  z-index:36; display:flex; gap:0; border-radius:999px; overflow:hidden;
  box-shadow:0 2px 10px rgba(90,70,50,.16); pointer-events:auto;
}
#catinMode button {
  border:none; margin:0; cursor:pointer;
  padding:.75vmin 2.4vmin; font-size:1.35vmin; letter-spacing:.12em;
  font-family:"Songti SC","SimSun",serif;
  background:rgba(250,246,238,.92); color:#6b5a48;
  transition:background .25s, color .25s;
}
#catinMode button.on { background:#2b2119; color:#f7f1e6; }

#catinGrad {
  display:none; position:fixed; left:50%; top:var(--cy);
  transform:translate(-50%,-50%);
  width:86vmin; height:86vmin; border-radius:50%; overflow:hidden;
  z-index:1; pointer-events:none;
}
#catinGrad canvas { width:100%; height:100%; display:block; }

#catinGradPal {
  display:none; position:fixed; left:50%; bottom:max(2.2vmin,10px);
  transform:translateX(-50%); z-index:35;
  flex-direction:column; align-items:stretch; gap:1.1vmin;
  background:rgba(250,246,238,.95); padding:1.3vmin 1.8vmin;
  border-radius:1.6vmin; box-shadow:0 3px 16px rgba(90,70,50,.18);
  pointer-events:auto; width:min(88vw, 46vmin);
}
/* 第一行：三个色位 + 保存 */
#catinGradPal .grow1 { display:flex; align-items:center; gap:1vmin; }
#catinGradPal .slot {
  flex:1; display:flex; align-items:center; justify-content:center; gap:.5vmin;
  border:1px solid rgba(120,96,72,.28); border-radius:999px;
  background:rgba(255,255,255,.5); cursor:pointer;
  padding:.85vmin .6vmin; font-size:1.15vmin; letter-spacing:.06em;
  font-family:"Songti SC","SimSun",serif; color:#5a4d40;
  transition:border-color .2s, background .2s;
}
#catinGradPal .slot .dot {
  width:1.5vmin; height:1.5vmin; border-radius:50%;
  border:1px solid rgba(0,0,0,.15); flex:0 0 auto;
}
#catinGradPal .slot.on {
  border-color:#2b2119; background:#fffdf8;
  box-shadow:inset 0 0 0 1px #2b2119;
}
#catinGradPal .gsave {
  flex:0 0 auto; border:none; cursor:pointer; white-space:nowrap;
  padding:.95vmin 2vmin; border-radius:999px;
  background:#2b2119; color:#f7f1e6;
  font-family:"Songti SC","SimSun",serif; font-size:1.2vmin; letter-spacing:.1em;
}
#catinGradPal .gsave:active { opacity:.75; }
/* 第二行：三档浓度 */
#catinGradPal .concs { display:flex; gap:1.6vmin; padding:0 .4vmin; }
#catinGradPal .conc {
  flex:1; -webkit-appearance:none; appearance:none;
  height:.5vmin; border-radius:999px; background:rgba(120,96,72,.25);
  outline:none; cursor:pointer;
}
#catinGradPal .conc::-webkit-slider-thumb {
  -webkit-appearance:none; width:2.2vmin; height:2.2vmin; border-radius:50%;
  background:#2b2119; border:1px solid #fffdf8; cursor:pointer;
}
#catinGradPal .conc::-moz-range-thumb {
  width:2.2vmin; height:2.2vmin; border-radius:50%;
  background:#2b2119; border:1px solid #fffdf8; cursor:pointer;
}
/* 第三行：预设色板 */
#catinGradPal .swatches {
  display:grid; grid-template-columns:repeat(10, 1fr);
  gap:.75vmin; justify-items:center; align-items:center;
}
#catinGradPal .sw {
  width:2.75vmin; height:2.75vmin; border-radius:50%; cursor:pointer;
  border:1px solid rgba(120,96,72,.25); padding:0;
  box-shadow:inset 0 -1px 3px rgba(0,0,0,.12);
  transition:transform .15s;
}
#catinGradPal .sw:active { transform:scale(.9); }

@media (max-width: 780px), (pointer: coarse) {

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════
   水墨流韵 — GPU 流体模拟（水拓画）
   速度场：Stable Fluids（平流 → 涡度 → 投影）
   墨色场：以吸光度累积，显示时按
           宣纸色 × exp(-A) 做减法混色
   ═══════════════════════════════════════════ */

const config = {
  SIM_RES: 256,           // 速度场分辨率
  DYE_RES: 1280,          // 墨色场分辨率（长边）
  PRESSURE_ITER: 26,
  VEL_DISSIPATION: 0.12,  // 水流衰减
  DYE_DISSIPATION: 0.042,  // 墨色消退（越小留得越久）
  CURL: 12,               // 涡旋强度
  SPLAT_RADIUS: 0.0027,
  SPLAT_FORCE: 5200,
};

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── 中国传统墨色（显示色 → 吸光向量） ── */
const INKS = {
  mo:   [0x1c/255, 0x1c/255, 0x22/255],  // 玄墨
  dai:  [0x1c/255, 0x4b/255, 0x7d/255],  // 黛青
  zhu:  [0xc2/255, 0x3b/255, 0x2e/255],  // 朱砂
  zhuq: [0x3a/255, 0x7d/255, 0x5d/255],  // 竹青
  teng: [0xc9/255, 0x94/255, 0x1a/255],  // 藤黄
};
const INK_KEYS = Object.keys(INKS);
const PAPER = [0xf2/255, 0xec/255, 0xdf/255]; // 宣纸

// 由显示色求吸光度向量：墨越浓 exp(-A) 越接近该色
function inkAbsorption(c, strength){
  const e = 0.012;
  return [
    -Math.log(Math.max(c[0], e)) * strength,
    -Math.log(Math.max(c[1], e)) * strength,
    -Math.log(Math.max(c[2], e)) * strength,
  ];
}

/* ════════ WebGL 初始化 ════════ */
const canvas = document.getElementById('c');
const params = { alpha:false, depth:false, stencil:false, antialias:false, preserveDrawingBuffer:false };
let gl = canvas.getContext('webgl2', params);
const isWebGL2 = !!gl;
if (!gl) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
if (!gl) { document.getElementById('hint').textContent = 'WebGL not supported in this browser'; return; }

let halfFloat, supportLinear;
if (isWebGL2){
  gl.getExtension('EXT_color_buffer_float');
  supportLinear = !!gl.getExtension('OES_texture_float_linear');
} else {
  halfFloat = gl.getExtension('OES_texture_half_float');
  supportLinear = !!gl.getExtension('OES_texture_half_float_linear');
}
const HALF_FLOAT = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;

function getFormat(internal, format){
  if (!isWebGL2) return { internal: gl.RGBA, format: gl.RGBA };
  // 检查可渲染性，不行则退到 RGBA16F
  if (renderable(internal, format)) return { internal, format };
  if (internal === gl.R16F  && renderable(gl.RG16F, gl.RG))   return { internal: gl.RG16F,   format: gl.RG };
  return { internal: gl.RGBA16F, format: gl.RGBA };
}
function renderable(internal, format){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.deleteFramebuffer(fbo); gl.deleteTexture(tex);
  return ok;
}
const fmtRGBA = isWebGL2 ? getFormat(gl.RGBA16F, gl.RGBA) : { internal: gl.RGBA, format: gl.RGBA };
const fmtRG   = isWebGL2 ? getFormat(gl.RG16F,  gl.RG)   : { internal: gl.RGBA, format: gl.RGBA };
const fmtR    = isWebGL2 ? getFormat(gl.R16F,   gl.RED)  : { internal: gl.RGBA, format: gl.RGBA };

/* ════════ 着色器 ════════ */
const VERT = `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform vec2 texelSize;
  void main(){
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }`;

const FRAG_COPY = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; uniform sampler2D uTexture;
  void main(){ gl_FragColor = texture2D(uTexture, vUv); }`;

const FRAG_FADE = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv; uniform sampler2D uTexture; uniform float value;
  void main(){ gl_FragColor = value * texture2D(uTexture, vUv); }`;

const FRAG_SPLAT = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  uniform float aspectRatio, radius;
  uniform vec3 color;
  uniform vec2 point;
  void main(){
    vec2 p = vUv - point;
    p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    gl_FragColor = vec4(base + splat, 1.0);
  }`;

const FRAG_ADVECT = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uVelocity, uSource;
  uniform vec2 texelSize, dyeTexelSize;
  uniform float dt, dissipation;
  #ifdef MANUAL_FILTERING
  vec4 bilerp(sampler2D sam, vec2 uv, vec2 tsize){
    vec2 st = uv / tsize - 0.5;
    vec2 iuv = floor(st), fuv = fract(st);
    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
  }
  #endif
  void main(){
    #ifdef MANUAL_FILTERING
    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
    vec4 result = bilerp(uSource, coord, dyeTexelSize);
    #else
    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
    vec4 result = texture2D(uSource, coord);
    #endif
    gl_FragColor = result / (1.0 + dissipation * dt);
  }`;

const FRAG_DIVERGENCE = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main(){
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) L = -C.x;
    if (vR.x > 1.0) R = -C.x;
    if (vT.y > 1.0) T = -C.y;
    if (vB.y < 0.0) B = -C.y;
    gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }`;

const FRAG_CURL = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main(){
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    gl_FragColor = vec4(R - L - T + B, 0.0, 0.0, 1.0);
  }`;

const FRAG_VORTICITY = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uVelocity, uCurl;
  uniform float curl, dt;
  void main(){
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy + force * dt;
    velocity = clamp(velocity, -1000.0, 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }`;

const FRAG_PRESSURE = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uPressure, uDivergence;
  void main(){
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    gl_FragColor = vec4((L + R + B + T - divergence) * 0.25, 0.0, 0.0, 1.0);
  }`;

const FRAG_GRADIENT = `
  precision mediump float; precision mediump sampler2D;
  varying vec2 vUv, vL, vR, vT, vB;
  uniform sampler2D uPressure, uVelocity;
  void main(){
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy - vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }`;

// 显示：宣纸 × exp(-吸光度)，并叠加细微纸纹
const FRAG_DISPLAY = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uDye;
  uniform vec3 paper;
  uniform vec2 res;
  float hash(vec2 p){
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }
  void main(){
    vec3 A = texture2D(uDye, vUv).rgb;
    vec3 col = paper * exp(-A);
    float grain = (hash(vUv * res) - 0.5) * 0.018;
    float fiber = (hash(floor(vUv * res * vec2(0.5, 3.0))) - 0.5) * 0.008;
    col += grain + fiber;
    // 四周淡淡晕染的纸边
    vec2 d = vUv * (1.0 - vUv);
    float vig = smoothstep(0.0, 0.06, min(d.x, d.y) * 2.2);
    col *= mix(0.96, 1.0, vig);
    gl_FragColor = vec4(col, 1.0);
  }`;

/* ════════ 程序封装 ════════ */
function compile(type, src, defines){
  if (defines) src = defines.map(d => '#define ' + d).join('\n') + '\n' + src;
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
  return sh;
}
function makeProgram(fragSrc, defines){
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc, defines));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  const uniforms = {};
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const name = gl.getActiveUniform(prog, i).name;
    uniforms[name] = gl.getUniformLocation(prog, name);
  }
  return { prog, uniforms, bind(){ gl.useProgram(prog); } };
}

const blit = (() => {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, -1,1, 1,1, 1,-1]), gl.STATIC_DRAW);
  const idx = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  return (target) => {
    if (target == null){
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };
})();

const progCopy       = makeProgram(FRAG_COPY);
const progFade       = makeProgram(FRAG_FADE);
const progSplat      = makeProgram(FRAG_SPLAT);
const progAdvect     = makeProgram(FRAG_ADVECT, supportLinear ? null : ['MANUAL_FILTERING']);
const progDivergence = makeProgram(FRAG_DIVERGENCE);
const progCurl       = makeProgram(FRAG_CURL);
const progVorticity  = makeProgram(FRAG_VORTICITY);
const progPressure   = makeProgram(FRAG_PRESSURE);
const progGradient   = makeProgram(FRAG_GRADIENT);
const progDisplay    = makeProgram(FRAG_DISPLAY);

/* ════════ 帧缓冲 ════════ */
function createFBO(w, h, fmt, filter){
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, w, h, 0, fmt.format, HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    tex, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id){
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      return id;
    },
  };
}
function createDoubleFBO(w, h, fmt, filter){
  let a = createFBO(w, h, fmt, filter);
  let b = createFBO(w, h, fmt, filter);
  return {
    width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read(){ return a; }, get write(){ return b; },
    swap(){ const t = a; a = b; b = t; },
  };
}

function getResolution(base){
  let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspect < 1) aspect = 1 / aspect;
  const min = Math.round(base), max = Math.round(base * aspect);
  return (gl.drawingBufferWidth > gl.drawingBufferHeight)
    ? { width: max, height: min } : { width: min, height: max };
}

let velocity, dye, pressure, divergence, curlFBO;
const FILTER = supportLinear ? gl.LINEAR : gl.NEAREST;

function initFBOs(){
  const sim = getResolution(config.SIM_RES);
  const dyeRes = getResolution(config.DYE_RES);
  velocity   = createDoubleFBO(sim.width, sim.height, fmtRG, FILTER);
  dye        = createDoubleFBO(dyeRes.width, dyeRes.height, fmtRGBA, FILTER);
  pressure   = createDoubleFBO(sim.width, sim.height, fmtR, gl.NEAREST);
  divergence = createFBO(sim.width, sim.height, fmtR, gl.NEAREST);
  curlFBO    = createFBO(sim.width, sim.height, fmtR, gl.NEAREST);
}

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    initFBOs();
  }
}
resize();
addEventListener('resize', resize);

/* ════════ 滴墨与水流 ════════ */
function splatVelocity(x, y, dx, dy){
  progSplat.bind();
  gl.uniform1i(progSplat.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(progSplat.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(progSplat.uniforms.point, x, y);
  gl.uniform3f(progSplat.uniforms.color, dx, dy, 0);
  gl.uniform1f(progSplat.uniforms.radius, correctRadius(config.SPLAT_RADIUS));
  blit(velocity.write);
  velocity.swap();
}
function splatDye(x, y, absorb, radiusScale){
  progSplat.bind();
  gl.uniform1i(progSplat.uniforms.uTarget, dye.read.attach(0));
  gl.uniform1f(progSplat.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(progSplat.uniforms.point, x, y);
  gl.uniform3f(progSplat.uniforms.color, absorb[0], absorb[1], absorb[2]);
  gl.uniform1f(progSplat.uniforms.radius, correctRadius(config.SPLAT_RADIUS * (radiusScale || 1)));
  blit(dye.write);
  dye.swap();
}
function correctRadius(r){
  const aspect = canvas.width / canvas.height;
  return aspect > 1 ? r * aspect : r;
}

/* 导出到 window，供外部录制脚本注入墨滴 */
window.splatDye = splatDye;
window.splatVelocity = splatVelocity;
window.__INKCOLORS = [[0x1c/255,0x1c/255,0x22/255],[0x1c/255,0x4b/255,0x7d/255],[0xc2/255,0x3b/255,0x2e/255],[0x3a/255,0x7d/255,0x5d/255],[0xc9/255,0x94/255,0x1a/255]];

/* ── 当前墨色 ── */
let currentInk = 'lun';
let cycleT = Math.PI * 0.3;

function lerp3(a, b, t){
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function pickColor(){
  if (currentInk !== 'lun') return INKS[currentInk];
  const n = INK_KEYS.length;
  const t = (cycleT % 1) * n;
  const i = Math.floor(t) % n, j = (i + 1) % n;
  return lerp3(INKS[INK_KEYS[i]], INKS[INK_KEYS[j]], t - i);
}

/* ════════ 指针交互 ════════ */
const pointers = new Map();
const hint = document.getElementById('hint');
let interacted = false;
function dismissHint(){
  if (!interacted){ interacted = true; hint.classList.add('gone'); }
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const _rd = canvas.getBoundingClientRect();
  pointers.set(e.pointerId, {
    x: (e.clientX - _rd.left) / _rd.width,
    y: 1 - (e.clientY - _rd.top) / _rd.height,
    down: true,
  });
  dismissHint();
  // 落笔即点墨
  const p = pointers.get(e.pointerId);
  splatDye(p.x, p.y, inkAbsorption(pickColor(), 0.85), 4.5);
  lastActive = performance.now();
});
canvas.addEventListener('pointermove', e => {
  const _rm = canvas.getBoundingClientRect();
  const x = (e.clientX - _rm.left) / _rm.width;
  const y = 1 - (e.clientY - _rm.top) / _rm.height;
  let p = pointers.get(e.pointerId);
  if (!p){
    p = { x, y, down: false };
    pointers.set(e.pointerId, p);
    return;
  }
  const dx = (x - p.x) * config.SPLAT_FORCE;
  const dy = (y - p.y) * config.SPLAT_FORCE;
  if (p.down){
    splatVelocity(x, y, dx, dy);
    splatDye(x, y, inkAbsorption(pickColor(), 0.34), 1);
    dismissHint();
  } else {
    // 悬停时仅拨动水面，不落墨
    splatVelocity(x, y, dx * 0.22, dy * 0.22);
  }
  p.x = x; p.y = y;
  lastActive = performance.now();
});
const endPointer = e => {
  const p = pointers.get(e.pointerId);
  if (p) p.down = false;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => pointers.delete(e.pointerId));

/* ════════ 自动演墨 ════════ */
let autoOn = !reducedMotion;
let lastActive = 0;
let nextDrop = performance.now() + 900;
let nextCurrent = performance.now() + 2600;

function autoDrop(now){
  const x = 0.15 + Math.random() * 0.7;
  const y = 0.2 + Math.random() * 0.6;
  const c = pickColor();
  splatDye(x, y, inkAbsorption(c, 0.4 + Math.random() * 0.35), 2 + Math.random() * 5);
  // 滴落激起的微澜
  const a = Math.random() * Math.PI * 2;
  splatVelocity(x, y, Math.cos(a) * 180, Math.sin(a) * 180);
  nextDrop = now + 2600 + Math.random() * 4200;
}
function autoCurrent(now){
  // 一道顺势而过的暗流
  const y0 = 0.25 + Math.random() * 0.5;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const amp = 0.05 + Math.random() * 0.12;
  const steps = 14;
  for (let i = 0; i <= steps; i++){
    const t = i / steps;
    const x = dir > 0 ? t : 1 - t;
    const y = y0 + Math.sin(t * Math.PI * 2 + Math.random()) * amp;
    splatVelocity(x, y, dir * 540 * (0.4 + Math.sin(t * Math.PI)), Math.cos(t * 6.0) * 160);
  }
  nextCurrent = now + 4200 + Math.random() * 5200;
}

/* ════════ 涤净 ════════ */
let washUntil = 0;
document.getElementById('washBtn').addEventListener('click', () => {
  washUntil = performance.now() + 3200;
  // 涤洗时荡起几道水流
  for (let i = 0; i < 5; i++){
    const a = Math.random() * Math.PI * 2;
    splatVelocity(Math.random(), Math.random(), Math.cos(a) * 800, Math.sin(a) * 800);
  }
  dismissHint();
});

/* ════════ 漆扇 ════════ */
const fanOverlay = document.getElementById('fanOverlay');
const fanCanvas  = document.getElementById('fanCanvas');
const fctx = fanCanvas.getContext('2d');

function drawFan(){
  const W = fanCanvas.width, H = fanCanvas.height;
  const cx = W / 2, cy = H * 0.86;          // 扇轴（扇钉位置）
  const R  = H * 0.78, r = R * 0.24;        // 外缘 / 内缘半径
  const half = Math.PI * 65 / 180;          // 半张角 65°
  const a0 = -Math.PI / 2 - half, a1 = -Math.PI / 2 + half;

  fctx.clearRect(0, 0, W, H);

  // 扇面路径
  const fanPath = () => {
    fctx.beginPath();
    fctx.arc(cx, cy, R, a0, a1);
    fctx.arc(cx, cy, r, a1, a0, true);
    fctx.closePath();
  };

  // 将水面墨纹拓入扇面（cover 填满扇面外接区域）
  fctx.save();
  fanPath();
  fctx.clip();
  const bx = cx - R, by = cy - R, bw = R * 2, bh = R * 1.3;
  const srcAspect = canvas.width / canvas.height;
  let dw = bw, dh = dw / srcAspect;
  if (dh < bh){ dh = bh; dw = dh * srcAspect; }
  fctx.drawImage(canvas, bx + (bw - dw) / 2, by + (bh - dh) / 2, dw, dh);
  // 扇面顶部一层薄薄的清漆光泽
  const sheen = fctx.createLinearGradient(0, by, 0, cy);
  sheen.addColorStop(0, 'rgba(255,250,238,.16)');
  sheen.addColorStop(.5, 'rgba(255,250,238,0)');
  sheen.addColorStop(1, 'rgba(60,40,20,.10)');
  fctx.fillStyle = sheen;
  fctx.fillRect(bx, by, bw, R);
  fctx.restore();

  // 扇骨
  const RIBS = 13;
  for (let i = 0; i < RIBS; i++){
    const a = a0 + (a1 - a0) * i / (RIBS - 1);
    const edge = (i === 0 || i === RIBS - 1);
    fctx.beginPath();
    fctx.moveTo(cx + Math.cos(a) * (edge ? 0 : r), cy + Math.sin(a) * (edge ? 0 : r));
    fctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    fctx.strokeStyle = edge ? 'rgba(58,38,22,.85)' : 'rgba(58,38,22,.22)';
    fctx.lineWidth = edge ? 9 : 3;
    fctx.lineCap = 'round';
    fctx.stroke();
  }

  // 内外缘描边
  fanPath();
  fctx.strokeStyle = 'rgba(58,38,22,.5)';
  fctx.lineWidth = 4;
  fctx.stroke();

  // 扇钉
  fctx.beginPath();
  fctx.arc(cx, cy, 11, 0, Math.PI * 2);
  fctx.fillStyle = '#3a2616';
  fctx.fill();
  fctx.beginPath();
  fctx.arc(cx - 3, cy - 3, 4, 0, Math.PI * 2);
  fctx.fillStyle = 'rgba(255,240,210,.55)';
  fctx.fill();

  // 扇面落印
  const sx = cx + Math.cos(a1 - 0.09) * R * 0.82;
  const sy = cy + Math.sin(a1 - 0.09) * R * 0.82;
  fctx.save();
  fctx.translate(sx, sy);
  fctx.rotate(-0.06);
  fctx.fillStyle = 'rgba(157,43,32,.92)';
  const s = 44;
  fctx.beginPath();
  if (fctx.roundRect) fctx.roundRect(-s/2, -s/2, s, s, 7); else fctx.rect(-s/2, -s/2, s, s);
  fctx.fill();
  fctx.fillStyle = '#f6efe2';
  fctx.font = '19px "Ma Shan Zheng", serif';
  fctx.textAlign = 'center';
  fctx.fillText('墨', 0, -2);
  fctx.fillText('韵', 0, 17);
  fctx.restore();
}

document.getElementById('fanBtn').addEventListener('click', () => {
  // 扇入水，荡起涟漪
  for (let i = 0; i < 3; i++){
    const a = Math.random() * Math.PI * 2;

/* ════════ 模拟主循环 ════════ */
let lastTime = performance.now();

function step(dt){
  gl.disable(gl.BLEND);

  // 涡度增强
  progCurl.bind();
  gl.uniform2f(progCurl.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progCurl.uniforms.uVelocity, velocity.read.attach(0));
  blit(curlFBO);

  progVorticity.bind();
  gl.uniform2f(progVorticity.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progVorticity.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progVorticity.uniforms.uCurl, curlFBO.attach(1));
  gl.uniform1f(progVorticity.uniforms.curl, config.CURL);
  gl.uniform1f(progVorticity.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  // 求散度并解压力（投影成无散场）
  progDivergence.bind();
  gl.uniform2f(progDivergence.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progDivergence.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  progFade.bind();
  gl.uniform1i(progFade.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(progFade.uniforms.value, 0.8);
  blit(pressure.write);
  pressure.swap();

  progPressure.bind();
  gl.uniform2f(progPressure.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progPressure.uniforms.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITER; i++){
    gl.uniform1i(progPressure.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  progGradient.bind();
  gl.uniform2f(progGradient.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progGradient.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(progGradient.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  // 平流速度场
  progAdvect.bind();
  gl.uniform2f(progAdvect.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!supportLinear)
    gl.uniform2f(progAdvect.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(progAdvect.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progAdvect.uniforms.uSource, velocity.read.attach(0));
  gl.uniform1f(progAdvect.uniforms.dt, dt);
  gl.uniform1f(progAdvect.uniforms.dissipation, config.VEL_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  // 平流墨色场
  const washing = performance.now() < washUntil;
  if (!supportLinear)
    gl.uniform2f(progAdvect.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(progAdvect.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(progAdvect.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(progAdvect.uniforms.dissipation, washing ? 2.4 : config.DYE_DISSIPATION);
  blit(dye.write);
  dye.swap();
}

function render(){
  progDisplay.bind();
  gl.uniform2f(progDisplay.uniforms.texelSize, 1 / canvas.width, 1 / canvas.height);
  gl.uniform1i(progDisplay.uniforms.uDye, dye.read.attach(0));
  gl.uniform3f(progDisplay.uniforms.paper, PAPER[0], PAPER[1], PAPER[2]);
  gl.uniform2f(progDisplay.uniforms.res, canvas.width, canvas.height);
  blit(null);
}

function frame(now){
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  cycleT += dt * 0.05;

  const idle = now - lastActive > 1800;
  if (autoOn && idle && !reducedMotion){
    if (now >= nextDrop) autoDrop(now);
    if (now >= nextCurrent) autoCurrent(now);
  }

  step(dt);
  render();
  requestAnimationFrame(frame);
}

// 开场：纸上先晕开两滴墨
if (!reducedMotion){
  splatDye(0.38, 0.58, inkAbsorption(INKS.mo, 0.8), 7);
  splatVelocity(0.38, 0.58, 320, -140);
  splatDye(0.62, 0.42, inkAbsorption(INKS.dai, 0.6), 5);
  splatVelocity(0.62, 0.42, -260, 180);
}
requestAnimationFrame(frame);

})();

    '#8c3b1e','#b5651d','#d08b3e','#d9a441','#c9b04a','#a5924a',
    '#6b7a3a','#4a6b4a','#2f6b5a','#2b5d7a','#3a4a5a','#26313d',
    '#c1362f','#a8303a','#a8405a','#8c2f52','#6b3a5a','#4a3050',
    '#c97a7a','#c9b6c9','#a8a0b8','#8b8378','#b8ab99','#6f6a62',
    '#e8dcc8','#f6f1e4','#fbf7ee','#d9cbb0','#9c8264','#5a4a38'
  ];
  var slotHtml = '';
  ['中心','中环','边缘'].forEach(function(t, i){
    slotHtml += '<button class="slot' + (i===0?' on':'') + '" data-i="' + i + '">' +
                '<span class="dot" id="dot' + i + '"></span>' + t + '</button>';
  });
  var swHtml = '';
  PRESETS.forEach(function(c){
    swHtml += '<button class="sw" data-c="' + c + '" style="background:' + c + '"></button>';
  });
  var concHtml = '';
  [45, 35, 20].forEach(function(v, i){
    concHtml += '<input type="range" min="5" max="80" step="1" value="' + v +
                '" data-ci="' + i + '" class="conc">';
  });
  gradPal.innerHTML =
    '<div class="grow1">' + slotHtml + '<button id="gradSave" class="gsave">保存</button></div>' +
    '<div class="concs">' + concHtml + '</div>' +
    '<div class="swatches">' + swHtml + '</div>';
  document.body.appendChild(gradPal);
  window.__CATIN_PRESETS = PRESETS;

  body.appendChild(Object.assign(document.createElement('div'), {id:'catinRim'}));

  var brand = document.createElement('div');
  brand.id = 'catinBrand';
  brand.innerHTML =
    '<div id="catinSeal">猫隐</div>' +
    '<div class="en">CATIN</div>' +
    '<div class="prod">映画伞里互动设计</div>' +
    '<div class="cn">猫隐</div>';
  body.appendChild(brand);


  var toast = Object.assign(document.createElement('div'), {id:'catinToast'});
  body.appendChild(toast);
  function say(m, ms){ toast.textContent = m; toast.style.opacity='1';
    clearTimeout(say._t); say._t = setTimeout(function(){ toast.style.opacity='0'; }, ms||2200); }

  /* ── 保存伞面（含猫层） ── */
  function saveUmbrella(){
    var isGrad = (window.catinGetMode && window.catinGetMode() === 'grad');
    var c = isGrad ? document.getElementById('catinGradCv') : document.getElementById('c');
    var S = 2000, R = S * 0.43, cx = S/2, cy = S/2;
    var out = document.createElement('canvas'); out.width = out.height = S;
    var g = out.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.fillStyle = PAPER; g.fillRect(0,0,S,S);

    g.save(); g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.clip();
    try { g.drawImage(c, cx-R, cy-R, R*2, R*2); } catch(e){}
    g.restore();

    if (!isGrad) {
      var rg = g.createRadialGradient(cx,cy,R*0.62,cx,cy,R);
      rg.addColorStop(0,'rgba(242,236,223,0)');
      rg.addColorStop(0.62,'rgba(242,236,223,0)');
      rg.addColorStop(0.80,'rgba(242,236,223,.16)');
      rg.addColorStop(0.94,'rgba(242,236,223,.62)');
      rg.addColorStop(1,'rgba(242,236,223,1)');
      g.save(); g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.clip();
      g.fillStyle = rg; g.fillRect(0,0,S,S); g.restore();
    }

    /* 猫周围留白柔光（渐变模式无猫） */
    if (!isGrad) {
    // 基准位置与 CSS 一致：left 50%-2.7vmin, top 50%+11vmin（1vmin = S/86）
    var glowCX = cx - S * (2.7 / 86), glowY = cy + S * (11 / 86);

    /* 猫层：按显示尺寸等比绘制 */
    var img = cat.querySelector('img');
    if (img && img.complete && img.naturalWidth) {
      var realH = S * (46 / 86);                      /* 46vmin / 86vmin */
      var realW = realH * (img.naturalWidth / img.naturalHeight);  /* 跟随当前图片比例 */
      g.save();
      g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.clip();
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      var _st = window.__elState || {x:0,y:0,s:1,r:0};
      var _vmin = Math.min(window.innerWidth, window.innerHeight) / 100;
      var _k = S / (0.86 * _vmin);
      g.translate(glowCX + _st.x * _k, glowY + _st.y * _k);
      g.rotate((_st.r || 0) * Math.PI / 180);
      g.scale(_st.s || 1, _st.s || 1);
      g.drawImage(img, -realW/2, -realH/2, realW, realH);
      g.restore();
    }
    }

    /* 伞骨 */
    var N = 32;
    for (var i = 0; i < N; i++) {
      var a = (i/N)*Math.PI*2 - Math.PI/2, dx = Math.cos(a), dy = Math.sin(a);
      var lg = g.createLinearGradient(cx,cy,cx+dx*R,cy+dy*R);
      lg.addColorStop(0,'rgba('+INKC+',.20)');
      lg.addColorStop(0.64,'rgba('+INKC+',.20)');
      lg.addColorStop(0.88,'rgba('+INKC+',.09)');
      lg.addColorStop(1,'rgba('+INKC+',0)');
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+dx*R, cy+dy*R);
      g.strokeStyle = lg; g.lineWidth = S*0.0035; g.lineCap='butt'; g.stroke();
    }

    g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2);
    g.strokeStyle='rgba('+RIMC+',.42)'; g.lineWidth=S*0.0030; g.stroke();
    g.beginPath(); g.arc(cx,cy,R-S*0.004,0,Math.PI*2);
    g.strokeStyle='rgba('+RIMC+',.16)'; g.lineWidth=S*0.0016; g.stroke();

    var hr = S*0.0165;
    var hg = g.createRadialGradient(cx-hr*.35,cy-hr*.38,hr*.1,cx,cy,hr);
    hg.addColorStop(0,'#93795f'); hg.addColorStop(.55,'#5b4636'); hg.addColorStop(1,'#3a2b20');
    g.beginPath(); g.arc(cx,cy,hr,0,Math.PI*2); g.fillStyle=hg; g.fill();

    /* 印章 + 题款：圆周右上 */
    var sw = S*0.045, sx = cx + R*0.58, sy = cy - R*0.58;
    g.save(); g.translate(sx,sy); g.rotate(-2*Math.PI/180);
    g.fillStyle = SEALC;
    g.beginPath();
    if (g.roundRect) { g.roundRect(-sw/2,-sw/2,sw,sw,sw*0.05); g.fill(); } else { g.fillRect(-sw/2,-sw/2,sw,sw); }
    g.fillStyle='#fff6ea';
    g.font='600 '+(sw*0.40).toFixed(1)+'px "Ma Shan Zheng","STXingkai","STKaiti",serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('猫',0,-sw*0.185); g.fillText('隐',0,sw*0.185);
    g.restore();

    g.save();
    g.font='400 '+(S*0.0335).toFixed(1)+'px "Ma Shan Zheng","STXingkai","STKaiti",serif';
    g.fillStyle='#2b2119'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('猫', sx+sw*0.92, sy-sw*0.52);
    g.fillText('隐', sx+sw*0.92, sy+sw*0.52);
    g.restore();

    out.toBlob(function(blob){
      if (!blob) { say('保存失败'); return; }
      var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
      var fname = '猫隐伞面_' + d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()) + '_' +
                  p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()) + '.png';
      var file = null;
      try { file = new File([blob], fname, {type:'image/png'}); } catch(e){}

      /* 手机优先走系统分享（可直接存相册 / 发微信） */
      if (matchMedia('(pointer: coarse)').matches && file && navigator.canShare && navigator.canShare({files:[file]})) {
        navigator.share({files:[file], title:'猫隐伞面'}).then(function(){
          say('已分享 / 保存');
        }).catch(function(){ /* 用户取消，静默 */ });
        return;
      }

      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.download = fname;
      a.href = url; body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
      say('已保存伞面 ' + S + '×' + S);
    }, 'image/png');
  }

  var oldBtn = document.getElementById('fanBtn');
  if (oldBtn) {
    var btn = oldBtn.cloneNode(true);
    btn.textContent = '保存';
    btn.removeAttribute('aria-pressed');
    btn.title = '把当前伞面保存为 PNG';
    oldBtn.parentNode.replaceChild(btn, oldBtn);
    btn.addEventListener('click', saveUmbrella);
  }
  var fo = document.getElementById('fanOverlay');
  if (fo) fo.style.display = 'none';

  window.__saveUmbrella = saveUmbrella;
  window.__setCat = function(src){ cat.querySelector('img').src = src; };
})();
</script>
<script>
/* ══════════ 渐变模式 ══════════ */
(function(){
  var mode = 'fluid';
  var noiseCv = null;
  var colors = ['#c9a63c', '#8fa07a', '#f2ecdf'];
  var conc = [45, 35, 20];
  var curSlot = 0;

  function hex2rgb(h){
    h = (h || '#000000').replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hsl(r, g, b){
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn, h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    var l = (mx + mn) / 2;
    var sat = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    return [h, sat * 100, l * 100];
  }
  function hsl2hex(h, s, l){
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    function f(v){ var t = Math.round((v + m) * 255).toString(16); return t.length < 2 ? '0'+t : t; }
    return '#' + f(r) + f(g) + f(b);
  }
  function mixHsl(c1, c2, t){
    var a = rgb2hsl.apply(null, hex2rgb(c1));
    var b = rgb2hsl.apply(null, hex2rgb(c2));
    var dh = b[0] - a[0];
    if (dh > 180) dh -= 360;
    if (dh < -180) dh += 360;
    var h = (a[0] + dh * t + 360) % 360;
    var s = a[1] + (b[1] - a[1]) * t;
    var l = a[2] + (b[2] - a[2]) * t;
    return hsl2hex(h, s, l);
  }

  function makeNoise(S){
    if (noiseCv) return noiseCv;
    var c = document.createElement('canvas'); c.width = S; c.height = S;
    var g = c.getContext('2d');
    var img = g.createImageData(S, S);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var n = 128 + (Math.random() - 0.5) * 42;
      d[i] = d[i+1] = d[i+2] = n;
      d[i+3] = 255;
    }
    g.putImageData(img, 0, 0);
    noiseCv = c;
    return c;
  }

  function hexA(hex, a){
    hex = (hex || '#000000').replace('#','');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    var n = parseInt(hex, 16);
    return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
  }

  function drawGradient(){
    var cv = document.getElementById('catinGradCv');
    if (!cv) return;
    var S = 900;
    cv.width = S; cv.height = S;
    var g = cv.getContext('2d');
    var cx = S/2, cy = S/2, R = S/2;

    var c0 = colors[0], c1 = colors[1], c2 = colors[2];

    // 同心径向渐变：浓度决定各色占比，HSL 插值保证过渡不发灰
    var rg = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    var tot = Math.max(1, conc[0] + conc[1] + conc[2]);
    var p1 = Math.max(0.06, Math.min(0.70, conc[0] / tot));
    var p2 = Math.max(p1 + 0.08, Math.min(0.94, (conc[0] + conc[1]) / tot));
    var N = 8, i, t;
    for (i = 0; i <= N; i++) {
      t = i / N;
      rg.addColorStop(p1 * t, mixHsl(c0, c1, t));
    }
    for (i = 0; i <= N; i++) {
      t = i / N;
      rg.addColorStop(p1 + (p2 - p1) * t, mixHsl(c1, c2, t));
    }
    rg.addColorStop(1.00, c2);
    g.fillStyle = rg;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();

    // 手工染色不均：几块偏移的柔和色斑，打破"数码渐变"的均匀感
    var spots = [
      {dx:-0.16, dy:-0.10, rx:0.46, c:c0, a:0.20},
      {dx: 0.18, dy: 0.12, rx:0.40, c:c1, a:0.16},
      {dx: 0.04, dy:-0.20, rx:0.32, c:c2, a:0.12},
      {dx:-0.10, dy: 0.20, rx:0.34, c:c1, a:0.09}
    ];
    for (var i = 0; i < spots.length; i++) {
      var sp = spots[i];
      var px = cx + sp.dx * S, py = cy + sp.dy * S, pr = sp.rx * R;
      var sg = g.createRadialGradient(px, py, 0, px, py, pr);
      sg.addColorStop(0, hexA(sp.c, sp.a));
      sg.addColorStop(0.55, hexA(sp.c, sp.a * 0.45));
      sg.addColorStop(1, hexA(sp.c, 0));
      g.fillStyle = sg;
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();
    }

    // 宣纸纹理（叠加 + 柔化）
    g.save();
    g.globalAlpha = 0.30;
    g.globalCompositeOperation = 'multiply';
    g.drawImage(makeNoise(S), 0, 0);
    g.restore();

    // 边缘墨晕：向内渐深的暗边，模拟纸边吸墨
    var vg = g.createRadialGradient(cx, cy, R*0.70, cx, cy, R);
    vg.addColorStop(0.00, 'rgba(58,44,30,0)');
    vg.addColorStop(0.60, 'rgba(58,44,30,0.04)');
    vg.addColorStop(0.86, 'rgba(58,44,30,0.11)');
    vg.addColorStop(1.00, 'rgba(58,44,30,0.20)');
    g.fillStyle = vg;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();

    // 一圈极淡的内晕，让渐变不"死"
    var ig = g.createRadialGradient(cx, cy, 0, cx, cy, R*0.55);
    ig.addColorStop(0, 'rgba(255,252,245,0.16)');
    ig.addColorStop(1, 'rgba(255,252,245,0)');
    g.fillStyle = ig;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();
  }

  function setMode(m){
    mode = m;
    var isGrad = (m === 'grad');
    var cvs = document.getElementById('c');
    var dock = document.querySelector('.dock');
    var cat = document.getElementById('catinCat');
    var glow = document.getElementById('catinCatGlow');

    if (cvs) cvs.style.display = isGrad ? 'none' : '';
    var gw = document.getElementById('catinGrad');
    if (gw) gw.style.display = isGrad ? 'block' : 'none';
    var gp = document.getElementById('catinGradPal');
    if (gp) gp.style.display = isGrad ? 'flex' : 'none';
    if (dock) dock.style.display = isGrad ? 'none' : '';
    var eb = document.getElementById('catinElBar');
    if (eb) eb.style.display = isGrad ? 'none' : 'flex';
    if (cat) cat.style.display = isGrad ? 'none' : '';
    if (glow) glow.style.display = isGrad ? 'none' : '';

    [].forEach.call(document.querySelectorAll('#catinMode button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-m') === m);
    });
    if (isGrad) { paintDots(); drawGradient(); }
  }

  document.getElementById('catinMode').addEventListener('click', function(e){
    var b = e.target.closest('button[data-m]');
    if (b) setMode(b.getAttribute('data-m'));
  });

  function paintDots(){
    for (var i = 0; i < 3; i++) {
      var d = document.getElementById('dot' + i);
      if (d) d.style.background = colors[i];
    }
  }

  [].forEach.call(document.querySelectorAll('#catinGradPal .slot'), function(b){
    b.addEventListener('click', function(){
      curSlot = parseInt(b.getAttribute('data-i'), 10) || 0;
      [].forEach.call(document.querySelectorAll('#catinGradPal .slot'), function(x){
        x.classList.toggle('on', x === b);
      });
    });
  });

  [].forEach.call(document.querySelectorAll('#catinGradPal .conc'), function(r){
    r.addEventListener('input', function(){
      conc[parseInt(r.getAttribute('data-ci'), 10) || 0] = parseInt(r.value, 10) || 10;
      drawGradient();
    });
  });

  [].forEach.call(document.querySelectorAll('#catinGradPal .sw'), function(b){
    b.addEventListener('click', function(){
      colors[curSlot] = b.getAttribute('data-c');
      paintDots();
      drawGradient();
    });
  });

  var gsBtn = document.getElementById('gradSave');
  if (gsBtn) gsBtn.addEventListener('click', function(){
    if (window.__saveUmbrella) window.__saveUmbrella();
  });


/* ══════════ 元素层（猫/桥/山）：拖动 缩放 旋转 ══════════ */
(function(){
  var cat = document.getElementById('catinCat');
  var canvas = document.getElementById('c');
  if (!cat || !canvas) return;
  var st = { x:0, y:0, s:1, r:0, sel:false, type:'cat' };
  var pts = {}, start = null, pinch = null;

  function apply(){
    var rt = document.documentElement.style;
    rt.setProperty('--ex', st.x + 'px');
    rt.setProperty('--ey', st.y + 'px');
    rt.setProperty('--es', st.s);
    rt.setProperty('--er', st.r + 'deg');
    cat.classList.toggle('sel', st.sel);
    window.__elState = st;
  }

  function ptList(){ return Object.keys(pts).map(function(k){ return pts[k]; }); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function ang(a,b){ return Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI; }

  /* ── 图片命中：按 alpha 轮廓判定，矩形内透明区域不再抢点击 ── */
  var HIT_W = 96, HIT_H = 128;
  var hitCv = document.createElement('canvas');
  var hitCtx = hitCv.getContext('2d');
  var hitData = null;

  function buildHit(){
    var im = cat.querySelector('img');
    if (!im || !im.complete || !im.naturalWidth) return;
    var ratio = im.naturalHeight / im.naturalWidth;
    HIT_H = 128;
    HIT_W = Math.max(24, Math.round(128 / ratio));
    hitCv.width = HIT_W; hitCv.height = HIT_H;
    hitCtx.clearRect(0, 0, HIT_W, HIT_H);
    // 膨胀：鲸鱼这类点阵图墨占比只有 5%，不膨胀几乎点不中
    hitCtx.filter = 'blur(1.8px)';
    hitCtx.drawImage(im, 0, 0, HIT_W, HIT_H);
    hitCtx.filter = 'none';
    try { hitData = hitCtx.getImageData(0, 0, HIT_W, HIT_H).data; } catch(e) { hitData = null; }
  }

  function hitTest(px, py){
    if (!hitData || st.type === 'none') return false;
    var w = cat.offsetWidth, h = cat.offsetHeight;
    if (!w || !h) return false;
    var r = cat.getBoundingClientRect();
    var mx = r.left + r.width / 2, my = r.top + r.height / 2;
    var dx = px - mx, dy = py - my;
    var a = -(st.r || 0) * Math.PI / 180;
    var rx = (dx * Math.cos(a) - dy * Math.sin(a)) / (st.s || 1);
    var ry = (dx * Math.sin(a) + dy * Math.cos(a)) / (st.s || 1);
    var ix = Math.floor((rx / w + 0.5) * HIT_W);
    var iy = Math.floor((ry / h + 0.5) * HIT_H);
    if (ix < 0 || iy < 0 || ix >= HIT_W || iy >= HIT_H) return false;
    return hitData[(iy * HIT_W + ix) * 4 + 3] > 14;
  }

  cat.style.pointerEvents = 'none';

  /* 双指基准：记录两指距离/角度/中点，以及缩放锚点 */
  function beginPinch(){
    var L = ptList();
    if (L.length < 2) return;
    pinch = {
      d: Math.max(8, dist(L[0], L[1])),
      a: ang(L[0], L[1]),
      s: st.s, r: st.r,
      mx: (L[0].x + L[1].x) / 2,
      my: (L[0].y + L[1].y) / 2,
      ox: st.x, oy: st.y
    };
  }

  function beginDrag(e){
    st.sel = true; apply();
    pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    start = { x:st.x, y:st.y, cx:e.clientX, cy:e.clientY };
  }

  function onMove(e){
    if (!pts[e.pointerId]) return;

  var ORDER = ['cat', 'warrior', 'whale', 'dandelion'];
  var html = '<button class="eb" data-el="none"><span class="thumb"></span></button>';
  ORDER.forEach(function(k){
    html += '<button class="eb' + (k === 'cat' ? ' on' : '') + '" data-el="' + k + '">' +
            '<span class="thumb"><img src="' + SRC[k] + '"></span></button>';
  });
  bar.innerHTML = html;
  document.body.appendChild(bar);

  function toast(msg){
    var t = document.getElementById('catinToast');
    if (!t) return;
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._t2); t._t2 = setTimeout(function(){ t.style.opacity = '0'; }, 2200);
  }

  var imgEl = cat.querySelector('img');

  function fitRatio(){
    if (!imgEl || !imgEl.naturalWidth) return;
    var ratio = imgEl.naturalWidth / imgEl.naturalHeight;
    cat.style.height = '46vmin';
    cat.style.width = (46 * ratio).toFixed(2) + 'vmin';
  }

  bar.addEventListener('click', function(e){
    var b = e.target.closest('.eb');
    if (!b) return;
    var el = b.getAttribute('data-el');
    [].forEach.call(bar.querySelectorAll('.eb'), function(x){ x.classList.toggle('on', x === b); });

    if (el === 'none') {
      cat.style.display = 'none';
      st.type = 'none';
      st.sel = false; apply();
      return;
    }
    if (imgEl && SRC[el] && imgEl.src !== SRC[el]) {
      imgEl.onload = function(){ fitRatio(); buildHit(); };
      imgEl.src = SRC[el];
    }
    cat.style.display = '';
    st.type = el;
    st.sel = false;
    st.x = 0; st.y = 0; st.s = 1; st.r = 0;
    apply();
    fitRatio();
    // 重播显影：每次换图都从模糊晕开
    cat.style.animation = 'none';
    void cat.offsetWidth;
    cat.style.animation = '';
  });


  buildHit();
  var _im0 = cat.querySelector('img');
  if (_im0) { if (_im0.complete) buildHit(); else _im0.addEventListener('load', buildHit); }

  apply();

  /* 供测试/外部调用 */
  window.catinSetEl = function(o){
    if (typeof o.x === 'number') st.x = o.x;
    if (typeof o.y === 'number') st.y = o.y;
    if (typeof o.s === 'number') st.s = Math.max(0.25, Math.min(5, o.s));
    if (typeof o.r === 'number') st.r = o.r;
    apply();
  };
})();

  // 暴露给保存逻辑
  window.catinSetMode = setMode;
  /* 渐变模式时隐藏元素栏 */
  var _setMode = window.catinSetMode;
  window.catinSetMode = function(m){
    if (_setMode) _setMode(m);
    bar.style.display = (m === 'grad') ? 'none' : 'flex';
  };

  window.catinDrawGradient = drawGradient;
  window.catinGetMode = function(){ return mode; };
})();
